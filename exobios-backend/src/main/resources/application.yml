spring:
  application:
    name: exobios-backend
  profiles:
    active: ${SPRING_PROFILE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:exobios}
    username: ${DB_USER:exobios}
    password: ${DB_PASSWORD:exobios}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ExobiosHikariPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        default_schema: public
    show-sql: false
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-replace-in-production-min-256-bits}
    access-token-expiry-ms: ${JWT_ACCESS_EXPIRY:86400000}
    refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY:604800000}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_API_KEY:dev-key}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000

  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Exobios Backend
    version: 0.0.1-SNAPSHOT
    description: AI-Assisted ASHA Worker Healthcare Platform
