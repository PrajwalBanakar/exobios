[pytest]
; Puts app/ on sys.path so app/main.py's own unqualified imports
; (`from api.routes import ...`, `from core... import ...`, etc.) resolve
; when pytest is invoked from the exobios-ai/ root as documented in
; docs/LOCAL_SETUP.md (`uv run --project app pytest tests/ -v`). Without
; this, `from app.main import app` in tests/conftest.py fails to collect
; with `ModuleNotFoundError: No module named 'api'`, which is why the test
; suite previously failed outright.
pythonpath = app
testpaths = tests
