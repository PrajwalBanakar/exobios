version: '3.8'

# ── Exobios Backend — Docker Compose ──────────────────────────────────────────
# Development usage:
#   Start only PostgreSQL:   docker compose up postgres -d
#   Start full stack:        docker compose up -d
#
# Ensure .env exists (copy from .env.example) before running.

services:

  postgres:
    image: postgres:16-alpine
    container_name: exobios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-exobios}
      POSTGRES_USER: ${DB_USER:-exobios}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-exobios}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-exobios} -d ${DB_NAME:-exobios}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exobios-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-exobios}
      DB_USER: ${DB_USER:-exobios}
      DB_PASSWORD: ${DB_PASSWORD:-exobios}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-86400000}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      AI_API_KEY: ${AI_API_KEY:-dev-key}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
    name: exobios_postgres_data
  uploads_data:
    name: exobios_uploads_data
